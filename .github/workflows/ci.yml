name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: ${{ matrix.name }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Format
                      run: npm run format:check
                    - name: Lint
                      run: npm run lint
                    - name: Type check
                      run: npm run typecheck
                    - name: Test
                      run: npm test
                    - name: Build
                      run: npm run build
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - run: ${{ matrix.run }}
